[project]
name = "memory-card"
version = "0.2.1"
description = "记忆卡片后端服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aerich[toml]>=0.9.2",
    "aiomysql>=0.3.2",
    "aiosqlite>=0.22.1",
    "asyncmy>=0.2.11",
    "asyncodbc>=0.1.1",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.128.0",
    "fastapi-cli>=0.0.20",
    "loguru>=0.7.3",
    "passlib>=1.7.4",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.21",
    "tortoise-orm>=0.25.3",
    "uvicorn>=0.40.0",
]

[project.scripts]
# 数据库迁移命令
migrate-init = "scripts.migrate:main"
migrate-upgrade = "scripts.migrate:full_upgrade"
migrate-rollback = "scripts.migrate:rollback"
migrate-status = "scripts.migrate:status"
# 数据库初始化命令
db-init = "scripts.init_db:main"

[tool.aerich]
tortoise_orm = "settings.TORTOISE_ORM"
location = "./migrations"
src_folder = "."

[tool.aerich.migrate]
# 迁移文件命名格式
naming_format = "version_{timestamp}"
